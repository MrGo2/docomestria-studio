[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docomestria-studio"
version = "0.2.7"
description = "Interactive visual viewer for docomestria — watch PDF extraction step-by-step"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Carlos Lorenzo", email = "carlos@edelwyss.es" }]
keywords = ["pdf", "extraction", "viewer", "docomestria", "demo"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "docomestria[openrouter,transform,llm,pipeline]>=0.6.4,<1",
    "Flask>=3.0,<4",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10",
    "ruff>=0.15,<0.16",
    "pre-commit>=4.6,<5",
    "reportlab>=4.0,<5",
]

[project.urls]
Homepage = "https://github.com/MrGo2/docomestria-studio"
Repository = "https://github.com/MrGo2/docomestria-studio"
Issues = "https://github.com/MrGo2/docomestria-studio/issues"

[project.scripts]
docomestria-studio = "docomestria_studio.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/docomestria_studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
